<nav class="navbar">
  <div class="brand">{{ brandName }}</div>

  <ul class="nav-links">
    @for (link of links; track link) {
      <li>
        <button
          type="button"
          [class.active]="activeLink() === link"
          (click)="selectLink(link)"
        >
          {{ link }}
        </button>
      </li>
    }
  </ul>
</nav>
